name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  webapp:
    name: webapp (vitest + typecheck ratchet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rwa-WebApp
    env:
      # Dummy values only. The tests mock Supabase and set their own keys;
      # these just keep module-level reads from seeing undefined.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      KYC_WALLET_HASH_SECRET: dummy-wallet-hash-secret
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rwa-WebApp/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npx vitest run
      - name: Type-check ratchet (fails if TS errors exceed .tsc-baseline)
        run: npm run typecheck:ratchet

  evm:
    name: evm (hardhat test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rwa-evm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rwa-evm/package-lock.json
      - run: npm ci
      - name: Hardhat tests
        run: npx hardhat test
